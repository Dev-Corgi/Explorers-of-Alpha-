  - id: 11010
    text: "An item that swaps the positions of\nPokémon in the same room.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Same room"
  - id: 11011
    text: "An item that lowers the Defense and\nSp. Def of enemies in the same room\nby 6 stages.\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Enemies in the room"
  - id: 11013
    text: "An item that cures bad status\nconditions of allies in the same room.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Allies in the room"
  - id: 11014
    text: "An item that gives the user the\nCounter and Mirror Coat statuses.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] User"
  - id: 11015
    text: "An item that changes the user's type\nto one chosen type, then fully\nrestores the user's HP.\n\n\n\n[BAR]\nRange:[CLUM_SET:36] User"
  - id: 11032
    text: "An item that triples the power of\nthe move the user uses on the\nnext turn.\n\n\n\n[BAR]\nRange:[CLUM_SET:36] User"
  - id: 11033
    text: "An item that gives Protect to the\nteam in the same room.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Team in the room"
  - id: 11037
    text: "An item that stops the team's moves\nfrom consuming PP on this floor.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Party on the floor"
  - id: 11042
    text: "An item that badly poisons every\nenemy on the floor.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] All enemies on the floor"
  - id: 11045
    text: "An item that lowers the Attack and\nSp. Atk of enemies in the same room\nby 6 stages.\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Enemies in the room"
  - id: 11055
    text: "An item that speeds up natural HP\nrecovery for allies in the same room.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Allies in the room"
  - id: 11056
    text: "An item that copies the last move\nused by the enemy in front.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Enemy in front"
  - id: 11050
    text: "An item that stops the team's Belly\nfrom decreasing on this floor.\n\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Party on the floor"
  - id: 11062
    text: "An item that restores HP for the user\nand team members on the floor. The\namount depends on the weather.\n\n\n\n[BAR]\nRange:[CLUM_SET:36] Team on the floor"
