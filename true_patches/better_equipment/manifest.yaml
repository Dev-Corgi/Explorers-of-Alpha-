id: better_equipment
version: 10
region: US
description: >
  Held-item changes. No-Stick Cap, Pecha Scarf, Persim Band, Weather Band,
  Insomniscope, Sneak Scarf, Trap Scarf, and Twist Band protect the whole
  team when one member holds them. Twist Band also blocks Defense and
  Special Defense drops. Ability Monitor stops the holder's abilities.
  Power Band, Def. Band, Special Band, and Zinc Band raise Attack, Defense,
  Special Attack, and Special Defense by 2 ranks while held, in place of the
  flat stat bonus. The bonus is added on top of the damage-calc stage, so a
  move rank already at +6 still counts as +8. Lens Scarf and Bright Ribbon
  do the same for accuracy and evasion.
  Munch Belt becomes Consistent Band: not-very-effective moves deal at least
  neutral damage, and it no longer drains Belly faster.
  Lockon Specs becomes Life Band (power x1.5, 10% max HP per attack).
  Patsy Band becomes Expert Band (super-effective power x1.5).
  Focus Scarf ignores type weaknesses when the holder takes damage:
  each super-effective matchup against the holder counts as neutral.
  Resistances are unchanged.
  Curve Band becomes Z-Scarf (team Z-Gauge gain x2). Rhythm Scarf adds 25%
  power per repeated attacking move, up to 2x.
  Pierce Band becomes Distribute Band. A stat rank change on the holder
  (Attack, Special Attack, Defense, Special Defense, accuracy, evasion)
  is copied to every ally in the same room. Enemies copy it to enemies
  in the room. If two or more on that side hold it, the effect stays off.
  Names overwrite existing strings.
  v8: Dropped the global entity-pointer RAM window. Eq_ItemIsActive was
  leaving r0 as 0x023E0000 after that check and passing it to HasHeldItem.
  Eq_Ability and Eq_SelfHolds now call IsMonster before HasHeldItem, matching
  vanilla AbilityIsActive.
  v9: Eq_BandStage defender check was moved off r9 after a wrong sb=r11
  reading. That is the opposite of vanilla.
  v10: Defender is r9 (mov r9, r1 at CalcDamage 0x0230BBCC). r11 is written
  later as a stage multiplier, not an entity. Eq_ItemIsActive(r11) data-aborts
  on melonDS.

