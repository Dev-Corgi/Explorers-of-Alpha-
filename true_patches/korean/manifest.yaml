id: korean
version: 6
region: US
description: >
  Korean text. Ports the unofficial Explorers of Sky Korean patch
  (하늘의 탐험대 1-101b) to Explorers of Alpha. Each text_e.str and script
  string takes the Korean translation only when its English text equals the
  EoS English the translation was made from; other strings stay English.
  The Korean glyph engine runs from an ov36 cave. Glyph bitmaps are loaded
  with ov36 at 0x023E0000 (past ExtraSpace). FONT/ko_glyph.bin is the same
  table. ARM9 PU region 2 is moved to 0x023F0000-0x023FFFFF so melonDS can
  read those bitmaps. Name-keyboard assembly is included. Apply after every
  other module.

kind: korean
rom_profile: us_vanilla

cave:
  binary: ov36
  code_bytes: 1280
  alignment: 4

asm:
  entry: asm/main.asm

data:
  text_e: data/text_e.json.gz
  scripts: data/scripts.json.gz
  ziti: data/ziti.bin

# Every word the Korean patch changes in arm9. branch_to_cave sites branch into
# the ov36 cave; all other words must equal the Korean patch after assembly.
