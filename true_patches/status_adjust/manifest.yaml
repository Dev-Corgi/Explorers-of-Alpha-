id: status_adjust
version: 26
region: US
description: >
  Protect / Detect share Protect status. Inflict writes counter byte 1 (v23; was 2).
  TickStatusAndHealthRegen decrements [monster+0xD6] at the start of the holder's
  own turn and ends the status at 0, so 1 lasts the rest of this round only.
  Endure also writes counter byte 1 (v24; was 2). Replaces random CalcStatusDuration+1.
  v25: Counter (reflect status 4) and Mirror Coat (8) also write counter byte 1.
  Counter shares its inflict path with Mini Counter and Metal Burst, so those
  get the same 1-round duration.
  Spite (DoMoveSpite) and Grudge (ExecuteMonsterAction, [monster+0x155] flag):
  last-used move PP is halved (rounded down) instead of set to 0.
  v21/v26: Reflect (physical) and Light Screen (special) multiply damage by 1/3
  instead of the shared Alpha factor (~79.7%). v26 retargets Alpha's status beq
  past the ov36 exclusive trampoline so the 1/3 mul always runs. Brick Break and
  exclusive bypass 0x44 are unchanged. Duration is unchanged.
  v22: dungeon stat stages (Atk, Sp. Atk, Def, Sp. Def, accuracy, evasion) move at most
  6 steps from neutral each way: stage 4..16 around 10, instead of 0..20. The six
  Boost/Lower functions clamp there, the raise-to-max effect stops at 16, and the AI
  redundancy checks (StatusCheckerCheck / OnTarget) and random stat pick use the same limits.

kind: asm
rom_profile: us_vanilla

