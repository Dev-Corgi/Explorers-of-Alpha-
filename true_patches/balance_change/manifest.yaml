    symbol: ExpSharePercentageSite
    binary: arm9
    vanilla_word: 0xE3A00032
    patched_word: 0xE3A00064
    chain: first

  - name: ExpShareUpgrade
    symbol: ExpShareUpgradeSite
    binary: ov36
    vanilla_word: 0xE0824003
    patched_word: 0xE3A04064
    chain: first

  - name: ExpShareToggle
    symbol: ExpShareToggleSite
    binary: ov36
    vanilla_word: 0xE3A01000
    patched_word: 0xE3A01064
    chain: first

  - name: GetMonsterMovesEntry
    symbol: GetMonsterMovesEntrySite
    binary: ov29
    vanilla_word: 0xE92D47F8
    chain: first
    target_symbol: BalanceChange_GetMonsterMoves

  - name: GetOutlawLevel
