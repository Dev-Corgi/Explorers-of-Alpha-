    binary: arm9
    vanilla_word: 0xE92D4008
    chain: first
    target_symbol: BalanceChange_OutlawLevel

  - name: GetOutlawMinionLevel
    symbol: GetOutlawMinionLevelSite
    binary: arm9
    vanilla_word: 0xE92D4008
    chain: first
    target_symbol: BalanceChange_OutlawLevel

  - name: OutlawSpawnLevel
    symbol: OutlawSpawnLevelSite
    binary: ov29
    vanilla_word: 0xE1C410B4
    chain: first
    target_symbol: BalanceChange_StoreOutlawLevel

  - name: OutlawHp
    symbol: OutlawHpSite
    binary: ov29
    vanilla_word: 0xE1D521F2
    chain: first
    target_symbol: BalanceChange_OutlawHp

  - name: DiffRebalance_ApplyEnemyMults
    symbol: DiffRebalance_ApplyEnemyMultsSite
    binary: ov36
    vanilla_word: 0xEB000B1B
    chain: first
