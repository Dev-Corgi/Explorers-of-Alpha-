id: shop_sell_price
version: 1
region: US
description: >
  Kecleon shop sell prices — set item_p.sell_price from buy_price (25% with
  2-significant-digit floor). Patches BALANCE and UTILITY copies (Alpha).

kind: data
rom_profile: us_vanilla

data:
