    target_symbol: ZMove_DrawThenGetMoney

ov29_cave:
  binary: ov36
  base_label: ZMoveOv29CodeAddress
  estimated_bytes: 8192
  alignment: 4
  export_symbols:
    # Hint only — apply_z_move re-resolves by prologue after armips (do not trust alone).
    ZMove_TryRestoreSlotForEntity: 0x390

arm9_cave:
  base_label: ZMoveArm9GaugeCave
  estimated_bytes: 64
  alignment: 4
  max_file_offset: 0xB0000
  forbidden:
    - start: 0x94624
      end: 0x94AE8

asm:
  dir: asm
  entry: main.asm

strings:
  yaml: strings.yaml

verify:
  - type: z_move_hooks
  - type: z_move_caves_nonempty
