    binary: ov29
    vanilla_word: 0xE1A00006
    chain: first
    target_symbol: ZMove_BeforeUsedMoveMessage

  - name: UseItemBeforeUsedMoveMessageC
    symbol: UseItemBeforeUsedMoveMessageHookSiteC
    binary: ov29
    vanilla_word: 0xE1A00006
    chain: first
    target_symbol: ZMove_BeforeUsedMoveMessage

  - name: ZMoveMenuHook
    symbol: ZMoveMenuHook
    binary: ov31
    vanilla_word: 0xEBFD97F6
    chain: first
    target_symbol: ZMove_Ov31MenuHook

  - name: ZMoveMoveConfirmHook
    symbol: ZMoveMoveConfirmHook
