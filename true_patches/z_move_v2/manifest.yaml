    binary: ov29
    vanilla_word: 0xE92D4038
    chain: first
    target_symbol: ZMove_GetMovePowerHook

  - name: IsRoomChargeMoveHook
    symbol: IsRoomChargeMove
    binary: ov29
    vanilla_word: 0x00000000
    chain: first
    target_symbol: ZMove_IsRoomChargeMoveHook

  - name: CalcDamageJudgmentTypeHook
    symbol: CalcDamageJudgmentTypeHookSite
    binary: ov29
    vanilla_word: 0x05D6005E
    chain: first
