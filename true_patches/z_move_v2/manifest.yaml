  - name: ExecuteMonsterActionEpilogueCleanup2Return
    symbol: ExecuteMonsterActionCleanup2Return
    binary: ov29
    vanilla_word: 0xE12FFF1E
    chain: first
    target_symbol: ZMove_Cleanup2Return

  - name: GetSubMenuStringIdZMoveBranch
    symbol: GetSubMenuStringIdReadSite
    binary: ov29
    vanilla_word: 0xE1A04001
    chain: append
    target_symbol: ZMove_GetSubMenuStringIdHook

  - name: AllocTopScreenStatusRestore
    symbol: AllocTopScreenStatus
    binary: ov29
    vanilla_word: 0xE92D4008
    chain: first

  - name: DungeonGroupEndZGauge
    symbol: DungeonFree
    binary: ov29
    vanilla_word: 0xE92D4008
    chain: append
    prior_label: ZMove_PriorDungeonFree
    vanilla_resume: 0x022DEAB4
    target_symbol: ZMove_OnDungeonGroupEnd

  - name: DealDamageBodyZGauge
    symbol: DealDamageBody
    binary: ov29
    vanilla_word: 0xE24DD028
    chain: first
    target_symbol: ZMove_DealDamageBodyEntry

  - name: ApplyDamageZGauge
