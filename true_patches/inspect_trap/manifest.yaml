id: inspect_trap
version: 3
region: US
description: >
  R immediately spends one turn and reveals hidden traps on the eight tiles
  adjacent to the controlled actor. The vanilla R diagonal-movement toggle is
  removed. The reveal uses the native visibility refresh and warp sound cue;
  Y direction inspection is unchanged and does not reveal traps.
  All traps are consumed after their effect runs once, using native trap removal.
kind: asm
rom_profile: us_vanilla
hooks:
  - name: InspectTrapR
    symbol: InspectTrapRSite
    binary: ov29
    vanilla_word: 0xE51F00B0
    chain: first
    target_symbol: InspectTrap_RAction
  - name: InspectTrapConsume
    symbol: InspectTrapConsumeSite
    binary: ov29
    vanilla_word: 0xE1A04000
    patched_word: 0xE3A04001
    chain: first
cave:
  binary: ov36
  estimated_bytes: 1024
  alignment: 4
  base_label: InspectTrapCodeAddress
asm:
  entry: asm/main.asm
verify:
  - type: hooks_are_branch
  - type: cave_nonempty
    overlay: ov36
