id: inspect_trap
version: 2
region: US
description: >
  Starting Y direction inspection permanently reveals hidden traps on the eight
  tiles adjacent to the controlled actor, including corridors and room borders.
  All traps are consumed after their effect runs once, using native trap removal.
kind: asm
rom_profile: us_vanilla
hooks:
  - name: InspectTrapBegin
    symbol: InspectTrapBeginSite
    binary: ov29
    vanilla_word: 0xEB01111C
    chain: first
    target_symbol: InspectTrap_Begin
  - name: InspectTrapConsume
    symbol: InspectTrapConsumeSite
    binary: ov29
    vanilla_word: 0xE1A04000
    patched_word: 0xE3A04001
    chain: first
cave:
  binary: ov36
  estimated_bytes: 1024
  alignment: 4
  base_label: InspectTrapCodeAddress
asm:
  entry: asm/main.asm
verify:
  - type: hooks_are_branch
  - type: cave_nonempty
    overlay: ov36
