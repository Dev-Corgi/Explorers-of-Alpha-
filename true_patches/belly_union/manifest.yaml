id: belly_union
version: 3
region: US
description: >
  Team members share one belly, stored on the leader and copied to the party.
  Food and other TryIncreaseBelly / TryDecreaseBelly changes update that value.
  The end-of-turn walk drain runs only when the leader walks, so manual control
  does not drain once per member. In manual state the walker is the Select
  leader. Held items that modify the drain are summed across the party into
  that one step. Munch Belt stays a no-op from better_equipment.
  Diet Orb (orb_charges_v2) sets OrbFx_DietFlag. While that byte is
  set, this shared walk drain does not run. A missing import is 0
  and is not dereferenced.
  v3: BellyUnion_IsTeam uses EntityIsValid plus the team-member flag.
  The main-RAM window that treated valid team pointers as non-team is gone.

kind: asm
rom_profile: us_vanilla

symbol_imports:
  - CeLeader
  - OrbFx_DietFlag

