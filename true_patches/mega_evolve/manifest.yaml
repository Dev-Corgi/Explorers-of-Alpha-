id: mega_evolve
version: 22
kind: mega_evolve
rom_profile: us_vanilla
phase: 6
species_save_bits: 12
description: >-
  Phase 6 uses the existing Evolve action for level80 Mega Evolution and
  unconditional Shiny Mega Evolution, with no separate Mega menu actions.
  Branch selection and single-stage regression are supported. Existing
  Primal/Origin forms awaken directly. Ordinary evolution and supported form
  changes remain; permanent XP, doping, nicknames and gender are preserved.
  All 1118 added rows use 586 sprite packages. Mega, Primal and Origin sprites
  include pose-stable aura; repeating source poses share the same aura pixels.
  Late evolution-animation callbacks do not write after the Spring controller closes.
  Trial Tower unlocks on a successful Spring Mega Evolution. It clones Zero Isle
  South with nine distinct randomized bosses and a level60 final trio; cloned
  fixed rooms advance on victory, with CalcStat HP multipliers and maximum IQ.
  Departure-menu state follows the original ARM PC-relative pointer load.
  Trial Tower uses Zero Isle South's warning/confirmation route with its own entry ID.
  Floor food/gummi weights follow the requested Apple/Big Apple and 17-gummi mix.
  Eight new fixed rooms256-263 supply key-room rewards, including a current-leader
  three-star family/type exclusive item. Boss rooms230-239 retain separate IDs.
  Team-spawn chaining preserves the earlier control_mode_enhance wrapper.
  Enhanced effects remain phase7.
requires:
  - z_move_v2
  - base_stats_speed
  - spinda_ev_speed
  - balance_change
  - bug_fixes
  - luminous_evolution
conflicts: []
