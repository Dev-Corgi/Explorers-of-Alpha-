id: control_mode_enhance
version: 13
region: US
description: >
  Full control mode. Start on any team member's turn toggles auto/manual, and
  Select stays camera mode. Each round starts on the current leader and walks
  the party in slot order, wrapping back to that leader before enemies.
  Manual to auto makes that pokemon the leader without reordering the lap
  already running; the next round starts on them. The leader is controlled.
  Anyone else is controlled in manual and takes the ally turn in auto.
  Guests always take the AI turn. The next floor's leader is vanilla.

kind: asm
rom_profile: us_vanilla

hooks:
  - name: CmeLeaderMenu
    symbol: CmeLeaderMenuSite
    binary: ov29
    vanilla_word: 0xEB00129D
    chain: first
    target_symbol: ControlModeEnhance_LeaderOrAi

  - name: CmeScanStay
