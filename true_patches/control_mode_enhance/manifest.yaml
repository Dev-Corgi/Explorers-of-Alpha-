id: control_mode_enhance
version: 20
region: US
description: >
  Full control mode. Start on any team member's turn toggles auto/manual, and
  Select stays camera mode. Manual rounds walk the party in slot order,
  wrapping back to the current leader before enemies. Auto uses the vanilla
  ally phase and its distance-ordered deferred movement retries.
  Manual to auto makes that pokemon the leader; remaining auto actions use
  vanilla ordering and the next round starts on them. The leader is controlled.
  Anyone else is controlled in manual and takes the ally turn in auto.
  Guests always take the AI turn and cannot inherit leadership after a faint.
  A regular member faint preserves its roster slot while another regular member
  lives; recruiting is blocked until the next floor. The next floor revives those
  members at full HP with death-time PP, then follows vanilla floor processing
  while keeping the current leader. Chimecho Assembly leader selection is always
  enabled in the main game so the leader can be changed after returning to town.
  Leader selection synchronizes persistent roster flags even when manual
  control already made that actor the engine's temporary leader.
  v20: Before send-home removal, synchronize the surviving designated leader
  so a manually controlled departing member is not preserved as a dead leader.
  Cancel only that guild member's pending revival reservation.
  v19: Members explicitly sent home use vanilla removal and are not reserved
  for revival on the next floor.

