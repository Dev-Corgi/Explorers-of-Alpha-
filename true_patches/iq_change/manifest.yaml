id: iq_change
version: 19
region: US
description: >
  Nonsleeper -> Status-Resistence (bad status inflict -> random Atk/SpA/Def/SpD +2).
  Critical Dodger (IQ 0x40) -> critical hits against it deal 1.2x instead of the crit
  multiplier (normal 1.25x on Alpha, 1.5x with damage_formula; Sniper 2x).
  Counter Basher (IQ 0x31) -> no physical full counter; instead counters special
  hits for 1/4 of the damage at the Counter Hitter roll chance.
  Deep Breather is vanilla again (one random under-max move).
  v2: sleep boost hooks TryInflictSleep real success (was wrapper already-asleep msg).
  v3: Status-Resistence boost +1 -> +2 stages.
  v8: Counter Basher uses Counter Hitter IQ gates (not vanilla CB/AoE hooks).
  v9: Counter Basher inflicts custom Mini Mirror Coat status + special reflect handler.
  v10: Deep Breather inline effect patch (replaces broken ov36 hook/cave rewrite).
  v11: Deep Breather loop branch fix — all valid move slots get +1 PP, not first only.
  v12: Counter Basher rewritten in ApplyDamageAndEffects counter section; removed v8/v9
    hooks (they targeted PP Saver, Gap Prober, ability/exclusive-item 0x54, etc.).
  v13: Deep Breather hooked in its real function (0x022FAA58); removed v10/v11 inline
    patches, which were in the Sleep Talk / Snore handler.
  v14: Critical Dodger rehooked on CalcDamage's crit multiplier loads (0x0230CEC8 Sniper,
    0x0230CEE0 normal); removed the hooks that disabled Aggressor (IQ 0x22, 0x0230BE78)
    and patched CalcRecoilDamageFixed (0x0230D1F0).
  v15: Deep Breather restored to vanilla (removed all-moves +1 PP hook and the
    wrong string-10080 overwrite).
  v16: Exp bonuses in AddExpSpecial apply to the whole party when the recipient
    is a team member: Exp. Elite, Wonder Chest, Miracle Chest, exclusive Exp boost.
  v17: Intimidator still stops a close-range move, but only while the user is at
    low HP (under 1/4), and the chance is 20% instead of 12%.
  v18: Critical Dodger and special Counter Basher were moved to r11 after a
    wrong sb=r11 reading. That is the opposite of vanilla.
  v19: Defender is r9 (CalcDamage mov r9, r1; SpecialCounter mov r0, r9).
    r11 is not the entity. IqSkillIsEnabled(r11) data-aborts on melonDS.

