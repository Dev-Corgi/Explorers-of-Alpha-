id: spinda_ev_speed
version: 19
region: US
description: >
  Spinda Cafe EV for the CalcStat stack. Save HP/Atk/SpA/Def/SpD/Spe bytes
  are doping V (Drink + outing). Caps stay floor(level/10)*5 per stat and
  floor(level/10)*13 total, now including Spe. Drink menu is
  HP/Atk/SpA/Def/SpD/Spe/Reset. EvFillBoosts reads those bytes directly.
  Permanent and outing V are saved separately with a versioned slot tail.
  The team stats page does not print (Vn); it shows CalcStat only.
  Drink Reset writes HP/Atk/SpA/Def/SpD/Spe V to 0. ExtraBits returns the
  remaining gummi mask in r1 so vanilla Atk GroundAdd cannot clamp a zeroed
  Atk V back to 1. HP/Spe drinks use GroundAddOffensiveStat on the cafe
  HP/Spe V bytes (r8-2 / r8-1), not GroundAddMaxHp or GetTeamMember-only
  writes. GroundAddMaxHp treats HP+Spe as one s16 and clamps to 999.
  Stat-select remaps 1..7 to Drink (4) and preserves cafe state r8.
  HP and Spe drinks use the same rose-by-delta cafe line as the other stats.
  Move-info Accuracy uses stars: 1 full star per 10 Accuracy, leftover
  remainder is a half star. Always Hit is not used for a numeric Accuracy,
  including 125. Z-Move (shell 559) skips the rank/Spe accuracy roll and
  always hits; Protect and the earlier MoveHitCheck exits still apply.
  Floor Gravity multiplies Accuracy by 5/3 on that same rank/Spe roll.
  Outing-end restore reads DUNGEON_PTR_MASTER (the pointer DungeonFree
  frees). The working DUNGEON_PTR is often already null on escape.
  Slot-tail schema v1 preserves full Speed and roster-indexed outing V.
  Stock monster streams contain permanent V without mutating live RAM.
  Unmarked saves require an explicit Alpha / Alpha+ import choice.
  Exclusive-item Atk/SpA/Def/SpD/HP boosts (vanilla amounts) enter CalcStat
  as volatile r3 doping via base_stats_speed; save V bytes are unchanged and
  post-CalcDamage / post-summary exclusive flats are removed there.
  Always apply after base_stats_speed. Charmander-placeholder SE seats,
  Same Species / listed-FR CalcStat HP, and FR51 Deoxys HP live in
  base_stats_speed (v39+ / v40+), not here. v18: SE table HP patches
  removed from this module (moved to base_stats_speed). Mutually
  exclusive with spinda_ev and spinda_ev_v2.

kind: spinda_ev
rom_profile: us_vanilla

optional_integrations:
  - id: room_charge_v3
    note: "No hook/cave overlap. ov29 cave chain ends before spinda's single summary hook."
  - id: orb_charges_v2
    note: "No overlap (ov29 + item data only)."
  - id: berry_boost
    note: "No overlap (dungeon item_cd vs cafe drink path)."
  - id: tm_read
    note: "No overlap (ov29/ov31 TM menu vs ov19 cafe + arm9 summary)."
  - id: z_move_v2
    note: >
      Apply z_move_v2 first. ARM9 gauge cave @ file 0xAF2C0 (64 B) must stay reserved;
      spinda reset cave max ends at 0xAF490. State reservation + manifest forbidden cover this.
      MoveHitRankApply chain=append after base_stats_speed so Z-Move (559) never misses
      and floor Gravity multiplies Accuracy by 5/3.

