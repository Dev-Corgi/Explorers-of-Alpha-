id: bug_fixes
version: 5
region: US
description: >
  Remove Alpha's passive Hail recovery bonus for monsters without Ice Body.
  Repair Mirror Armor reflection pointers, respect ability suppression for
  Trace, and restrict Neutralizing Gas to adjacent live monsters on either side.
  Ice Body's contact frostbite and other recovery modifiers retain their behavior.
  Remove Mechanical Array and difficulty-based dungeon shortening so every
  difficulty uses the Hardcore floor count, including mission destinations.
  Restore enemy Imposter/Illusion spawn processing on normal floors and
  safely skip empty disguise candidate lists.
  Skip Alpha's story-dependent ally stat/HP cap block; retain difficulty
  mechanics and the separate Drink doping allocation limits.

kind: asm
rom_profile: us_vanilla

hooks:
  - name: RemoveStoryStatCaps
    symbol: BugFixStoryStatCapSite
    binary: ov36
    vanilla_word: 0xE3A07000
    patched_word: 0xEA000040
  - name: SpawnTransformFloorGate
    symbol: BugFixSpawnTransformSite
    binary: ov36
    vanilla_word: 0x1A00011E
    target_symbol: BugFix_SpawnTransform
  - name: SpawnTransformEmptyList
    symbol: BugFixSpawnCandidatesSite
    binary: ov36
    vanilla_word: 0xE1A06000
    target_symbol: BugFix_SpawnCandidates
  - name: RemoveNonIceBodyHailRegenBonus
    symbol: BugFixHailRegenBonusSite
    binary: ov29
    vanilla_word: 0x00844000
    patched_word: 0xE1A00000
  - name: MirrorArmorAttackReflection
    symbol: BugFixMirrorAttackSite
    binary: ov36
    vanilla_word: 0xE1A08000
    target_symbol: BugFix_MirrorAttack
  - name: MirrorArmorDefenseReflection
    symbol: BugFixMirrorDefenseSite
    binary: ov36
    vanilla_word: 0xE1A08000
    target_symbol: BugFix_MirrorDefense
  - name: MirrorArmorHitChanceReflection
    symbol: BugFixMirrorHitChanceSite
    binary: ov36
    vanilla_word: 0xE1A07000
    target_symbol: BugFix_MirrorHitChance
  - name: TraceSuppressionCheck
    symbol: BugFixTraceAbilityReadSite
    binary: ov29
    vanilla_word: 0xE5D60060
    target_symbol: BugFix_Trace
  - name: NeutralizingGasRange
    symbol: BugFixGasSuppressionSite
    binary: ov36
    vanilla_word: 0xE92D0002
    target_symbol: BugFix_GasSuppression

cave:
  binary: ov36
  estimated_bytes: 832
  alignment: 4
  base_label: BugFixCodeAddress

asm:
  entry: asm/main.asm

dungeon_floor_limits:
  path: UTILITY/inter_d.bin
  remove_performance_flags: [45, 56, 57]

verify:
  - type: hooks_are_branch
  - type: cave_nonempty
    overlay: ov36

notes: >
  Preserve the Hail fix from v1. Dynamically allocate the v2 helpers in overlay36.
  Nearby means the eight adjacent tiles; a gas holder does not suppress itself
  or another Neutralizing Gas ability. Gastro Acid and Ability Monitor still
  disable the gas holder. Apply after other gameplay modules, before korean.
  v3 removes 62 shortening exits across 33 dungeon IDs; unrelated exits remain.
